name: Update inReach position

on:
  schedule:
        - cron: "3-59/5 * * * *"   # fires at :03,:08,:13,… — far less throttled than */5
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest position (Garmin inReach)
        run: python3 scripts/fetch_position.py

      - name: Fetch official aid splits (Aravaipa)
        run: python3 scripts/fetch_splits.py || echo "splits fetch failed; keeping previous splits.json"

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain position.json positions.jsonl splits.json)" ]]; then
            git config user.name  "inreach-bot"
            git config user.email "actions@users.noreply.github.com"
            git add position.json positions.jsonl splits.json
            git commit -m "update: $(date -u +%H:%MZ)"
            git push
          else
            echo "No change."
          fi
